[package]
name = "gutil"
version = "0.5.0"
edition = "2021"
description = "A single-binary, cross-platform reimplementation of GNU coreutils"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Leitwolf11/gutil"
readme = "README.md"
keywords = ["coreutils", "cli", "filesystem"]
categories = ["command-line-utilities"]

[dependencies]
ariadne = "0.6"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
parking_lot = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustc-hash = "2.1"
rusty-rich = { version = "0.4", default-features = false }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
smallvec = "1.15"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
toml = "1"
terminal_size = "0.4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
insta = "1"
proptest = "1"

[[bench]]
name = "ls"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
