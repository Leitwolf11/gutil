[workspace]
members = ["gutil", "gutil-plugin-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Leitwolf11/gutil"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
