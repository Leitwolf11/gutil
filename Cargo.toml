[package]
name = "gutil"
version = "0.1.0"
edition = "2021"
description = "A single-binary, cross-platform reimplementation of GNU coreutils"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Leitwolf11/gutil"
readme = "README.md"
keywords = ["coreutils", "cli", "filesystem"]
categories = ["command-line-utilities"]

[dependencies]
ariadne = "0.6"
jiff = { version = "0.2", default-features = false, features = ["std"] }
parking_lot = "0.13"
rustc-hash = "2.1"
rusty-rich = { version = "0.4", default-features = false }
smallvec = "1.15"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
insta = "1"
proptest = "1"
tempfile = "3"

[[bench]]
name = "ls"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
