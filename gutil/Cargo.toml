[package]
name = "gutil"
version = "0.16.0"
edition.workspace = true
description = "A single-binary, cross-platform reimplementation of GNU coreutils"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["coreutils", "cli", "filesystem"]
categories = ["command-line-utilities"]

[dependencies]
ariadne = "0.6"
aws-lc-rs = { version = "1", default-features = false, features = ["non-fips"] }
data-encoding = "2"
gutil-plugin-sdk = { path = "../gutil-plugin-sdk", version = "0.1.0" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
md-5 = { version = "0.11", default-features = false }
memchr = "2"
parking_lot = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustc-hash = "2.1"
rusty-rich = { version = "0.4", default-features = false }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
smallvec = "1.15"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
toml = "1"
terminal_size = "0.4"
unicode-width = "0.2"
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch"] }
wasmi_wasi = "2"
ignore = "0.4"
globset = "0.4"
regex = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["fs"] }
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.40.4", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
fs4 = { version = "1.1", default-features = false }
atomicwrites = "0.4.4"
winapi-util = "0.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
insta = "1"
proptest = "1"

[[bench]]
name = "ls"
harness = false

[lints]
workspace = true

[[bench]]
name = "checksum"
harness = false

[[bench]]
name = "streams"
harness = false

[[bench]]
name = "paths"
harness = false

[[bench]]
name = "shell"
harness = false

[[bench]]
name = "fd"
harness = false

[[bench]]
name = "disk"
harness = false

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "mutate"
harness = false
